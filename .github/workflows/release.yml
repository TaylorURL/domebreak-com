name: Release — deploy site

# Redeploys the marketing site to Vercel production on every push to main, and
# on dispatch (how the release process refreshes it after shipping).
#
# This carries no release version of its own: /version.json is a rewrite to the
# download host's latest.json (web/vercel.json), which only the release process
# stamps. So a deploy from any main push serves the version whose installers are
# actually published, never the one main happens to be numbered.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_8KwOtFUhRyHmZM8dPzqh0fq9
      VERCEL_PROJECT_ID: prj_gVVToIRWCTEr9T6WHRAeCj1mhrXa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The site build imports the game engine from ../src, whose bare imports
      # resolve from the repo-root node_modules — install them.
      - run: npm ci
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
