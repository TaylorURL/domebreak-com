            /*
                What the browser draws for the moment before the faces above
                arrive. The overrides are measured rather than guessed: at 100px,
                the same sample string sets 2743.51px wide in Inter against
                2562.7px in Arial (107.06%) and 3240px in JetBrains Mono against
                3251.07px in Menlo (99.66%), and the ascent and descent are the
                measured 97/24 and 102/30 divided by that same factor.
                Sized this way the fallback occupies the line the real face will,
                so the swap changes the shapes and moves nothing.
            */
            @font-face {
                font-family: "Inter Fallback";
                font-display: swap;
                src: local("Arial");
                size-adjust: 107.06%;
                ascent-override: 90.6%;
                descent-override: 22.42%;
                line-gap-override: 0%;
            }
            @font-face {
                font-family: "JetBrains Mono Fallback";
                font-display: swap;
                src: local("Menlo"), local("Consolas");
                size-adjust: 99.66%;
                ascent-override: 102.35%;
                descent-override: 30.1%;
                line-gap-override: 0%;
            }

        <script>
            (function () {
                var endpoint = "https://sunday.tail1f78d7.ts.net/report";
                var site = "DomeBreak";
                var sent = 0;
                // Nothing the page can intercept reaches the visitor's console. Each
                // error is reported first and swallowed second, so the report is made
                // whether or not the suppression holds. What survives is written by the
                // browser's own network layer, which no page script can reach.
                var loud = false;
                var held = [];
                try {
                    if (location.search.indexOf("console=on") > -1) localStorage.setItem("reporter-console", "1");
                    if (location.search.indexOf("console=off") > -1) localStorage.removeItem("reporter-console");
                    loud = localStorage.getItem("reporter-console") === "1";
                } catch (ignored) {}
                // An extension injects its scripts into the page, so a rejection thrown
                // inside one arrives at this handler with nothing of the site in its
                // stack. A stack naming only extension scripts describes the visitor's
                // browser; one carrying a single site frame is the site's.
                function extensionOnly(stack) {
                    var schemes = String(stack || "").match(/[a-z][a-z0-9+.-]*:\/\//gi);
                    if (!schemes) return false;
                    for (var i = 0; i < schemes.length; i += 1) {
                        var scheme = schemes[i].slice(0, -3).toLowerCase();
                        if (scheme.slice(-9) !== "extension") return false;
                    }
                    return true;
                }
                // A request the page makes writes its own failure to the console when it
                // fails, and a collector that cannot be reached would then be the loudest
                // thing on the page. The same request issued inside a worker writes
                // nothing, so reports travel that way while the page is alive.
                var unloading = false;
                var worker = null;
                var workerFailed = false;
                function transport() {
                    if (worker || workerFailed) return worker;
                    try {
                        var source =
                            "self.onmessage=function(e){fetch(e.data.endpoint,{method:'POST',body:e.data.body}).then(function(){},function(){})}";
                        worker = new Worker(URL.createObjectURL(new Blob([source], {type: "text/javascript"})));
                    } catch (ignored) {
                        workerFailed = true;
                    }
                    return worker;
                }
                function send(body) {
                    // On the way out the worker dies with the page, and the console goes
                    // with it, so the beacon's survival is worth more than its silence.
                    if (!unloading) {
                        var channel = transport();
                        if (channel) {
                            channel.postMessage({endpoint: endpoint, body: body});
                            return;
                        }
                    }
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon(endpoint, body);
                    } else {
                        fetch(endpoint, {method: "POST", body: body, keepalive: true}).catch(function () {});
                    }
                }
                addEventListener("pagehide", function () {
                    unloading = true;
                });
                // Everything swallowed stays readable on the page itself, so a live
                // console with the flag off still answers what happened.
                function hold(kind, message, stack) {
                    if (held.length < 50) held.push({kind: kind, message: String(message), stack: String(stack || "")});
                }
                window.__reporter = {
                    held: held,
                    replay: function () {
                        return held.slice();
                    },
                };
                function report(kind, message, stack) {
                    hold(kind, message, stack);
                    if (sent >= 10) return; // a page stuck in an error loop stops at ten
                    if (extensionOnly(stack)) return;
                    sent += 1;
                    try {
                        send(
                            JSON.stringify({
                                site: site,
                                kind: kind,
                                message: String(message || "Unknown error").slice(0, 1500),
                                stack: String(stack || "").slice(0, 4000),
                                url: location.href,
                                userAgent: navigator.userAgent,
                            }),
                        );
                    } catch (ignored) {}
                }
                function flatten(args, from) {
                    var parts = [];
                    for (var i = from; i < args.length; i += 1) {
                        var piece = args[i];
                        if (piece && piece.stack) {
                            parts.push(piece.stack);
                        } else if (typeof piece === "object") {
                            try {
                                parts.push(JSON.stringify(piece));
                            } catch (ignored) {
                                parts.push(String(piece));
                            }
                        } else {
                            parts.push(String(piece));
                        }
                    }
                    return parts.join(" ");
                }
                // Capture phase, because element load failures fire error events that do not bubble.
                window.addEventListener(
                    "error",
                    function (event) {
                        try {
                            if (event.target && event.target !== window && event.target.tagName) {
                                report(
                                    "resource",
                                    "Failed to load " +
                                        event.target.tagName.toLowerCase() +
                                        ": " +
                                        (event.target.src || event.target.href || ""),
                                );
                            } else {
                                report("uncaught", event.message, event.error && event.error.stack);
                            }
                        } finally {
                            if (!loud) event.preventDefault();
                        }
                    },
                    true,
                );
                window.addEventListener("unhandledrejection", function (event) {
                    try {
                        var reason = event.reason;
                        report("rejection", reason && reason.message ? reason.message : reason, reason && reason.stack);
                    } finally {
                        if (!loud) event.preventDefault();
                    }
                });
                // A library writing to these is addressing whoever maintains the site
                // rather than whoever is reading the page, so the message travels to the
                // Pi instead of to the visitor's console.
                ["error", "warn", "trace"].forEach(function (level) {
                    var original = console[level];
                    console[level] = function () {
                        report("console", flatten(arguments, 0));
                        if (loud) original.apply(console, arguments);
                    };
                });
                var originalAssert = console.assert;
                console.assert = function (condition) {
                    if (condition) return;
                    report("console", "Assertion failed: " + flatten(arguments, 1));
                    if (loud) originalAssert.apply(console, arguments);
                };
                if (window.fetch) {
                    var originalFetch = window.fetch;
                    window.fetch = function (input) {
                        var target = typeof input === "string" ? input : (input && input.url) || "";
                        // Reports about the reporter's own request would loop, so the endpoint passes through unwrapped.
                        if (target.indexOf(endpoint) === 0) return originalFetch.apply(window, arguments);
                        return originalFetch.apply(window, arguments).then(
                            function (response) {
                                if (response.status >= 500)
                                    report("http", "HTTP " + response.status + " from " + target.split("?")[0]);
                                return response;
                            },
                            function (error) {
                                // A cancelled request is this page changing its mind, not a server
                                // it could not reach. MapLibre drops tile reads the camera has
                                // moved past, and the hero map's drift does that several times a
                                // visit — enough to spend the ten-report budget before a real
                                // error has anywhere to go.
                                if (!error || error.name !== "AbortError") {
                                    report(
                                        "network",
                                        (error && error.message ? error.message : String(error)) +
                                            " fetching " +
                                            target.split("?")[0],
                                    );
                                }
                                throw error;
                            },
                        );
                    };
                }
            })();
        </script>

    <body>
        <div id="root">
            <!-- The build renders the landing page into the slot below
                 (scripts/prerender.mjs), so the document arrives with something to
                 paint. React mounts over it. -->
            <!--prerender-->
        </div>
        <script>
            // The hash never reaches a server, so one document answers for every
            // route and what the build writes into the slot above
            // (scripts/prerender.mjs) is the home page and nothing else. A visit
            // addressed elsewhere drops it here, while the parser is still inside
            // the body and nothing has been painted, rather than showing the
            // landing page for the moment before the bundle renders the route that
            // was actually asked for.
            (function () {
                if (location.hash.slice(0, 2) !== "#/") return;
                var painted = document.querySelector("[data-prerendered]");
                if (painted) painted.remove();
            })();
        </script>
